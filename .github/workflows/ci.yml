name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: make fmt-check

      - run: make vet

      - run: make lint

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: make cover

      # Enforces the coverage threshold everywhere and, on main only, commits the
      # badge SVG to the orphan `badges` branch. The token is deliberately empty
      # off main so fork pull requests skip the write they are not allowed to make.
      - uses: vladopajic/go-test-coverage@v2
        with:
          profile: coverage.out
          threshold-total: 80
          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges
