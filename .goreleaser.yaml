version: 2

release:
  github:
    owner: ProbstenHias
    name: anexia-cli

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: anexia
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/ProbstenHias/anexia-cli/internal/cli.version={{.Version}} -X github.com/ProbstenHias/anexia-cli/internal/cli.commit={{.Commit}} -X github.com/ProbstenHias/anexia-cli/internal/cli.date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: anexia
    binaries:
      - anexia
    repository:
      owner: ProbstenHias
      name: homebrew-tap
      branch: main
      # Pushed over SSH with a deploy key scoped to the tap, so no personal
      # access token with account-wide repo scope is needed.
      git:
        url: git@github.com:ProbstenHias/homebrew-tap.git
        private_key: '{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}'
    homepage: https://github.com/ProbstenHias/anexia-cli
    description: Command-line interface for the Anexia Engine API
    url:
      verified: github.com/ProbstenHias/anexia-cli/
    # The binary is neither signed nor notarized, so macOS quarantines it and
    # reports "anexia is damaged". Strip the quarantine bit on install instead.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/anexia"]
          end

changelog:
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Refactors
      regexp: '^.*?refactor(\(.+\))??!?:.+$'
      order: 3
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs'
      - '^test'
      - '^chore'
